[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
api = { path = "../api" }
tools = { path = "../tools" }
db = { path = "../db" }
memory = { path = "../memory" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tauri = { workspace = true }
futures = "0.3"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }

[features]
# Exposes `runtime::testing` (a recording EventSink) to other crates.
testing = []

[dev-dependencies]
api = { path = "../api" }
async-trait = "0.1"
db = { path = "../db", features = ["testing"] }
tempfile = "3"
