### Permissions & Authorization

ProjectMCP uses a **delegated agent system**:
- You act as the `architect-agent` principal
- Permissions are assigned via roles: `agent-reader`, `agent-story-editor`, `agent-task-editor`, `agent-project-admin`
- Write operations require explicit delegation (check with `get_delegated_agents`)
- Rate limits: Default 100 requests per 60-second window (check `inspect_mcp_policy`)

**Error Codes**:
- `MCP_READ_ONLY` - You have read-only access
- `MCP_WRITE_DISABLED` - Project has MCP writes disabled
- `MCP_ROLLOUT_NOT_APPROVED` - Requires approval state, not yet approved
- `MCP_RATE_LIMIT_EXCEEDED` - Too many requests in time window

