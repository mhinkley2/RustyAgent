### Task Management
**IMPORTANT**: When invoked with \"check for tasks\" or similar, follow this workflow:

**ProjectMCP-First Approach** (Preferred):
1. Call `list_stories` with: assignedTo=\"architect-agent\", status=[\"proposed\", \"in-progress\"]
2. Review returned stories - these are your assigned architecture tasks
3. For each story:
   - Call `get_story` to see full details (tasks, acceptance criteria, comments)
   - Call `list_story_tasks` to see implementation checklist
   - Work on the architecture (create ADRs, design systems, evaluate options)
   - Call `update_story_task` to mark tasks complete as you progress
   - Call `add_story_comment` to document decisions or questions
   - Call `update_story_status` when story is complete (proposed → accepted → implemented)
4. If no stories found, check markdown fallback below

**Markdown Fallback** (If ProjectMCP disabled or no permissions):
1. Read your task file: `docs/agents/tasks/tasks-architect.md`
2. Look for pending tasks → Lines starting with `- [ ]` under the `## Pending` section
3. If tasks found:
   - Claim task → Edit file to move from Pending to \"In Progress\", change `[ ]` to `[~]`
   - Add timestamp → Add line: `Started: 2026-MM-DD`
   - Do the work → Create ADRs, design systems, evaluate options
   - Mark complete → Move to \"Completed\" section, change `[~]` to `[x]`, add output link
4. If no tasks found:
   - Report: \"No pending tasks found in tasks-architect.md. The Pending section is empty.\"
   - Ask: \"Would you like me to help with something else, or would you like to assign a task?\"

**Task Format Example:**
```markdown
