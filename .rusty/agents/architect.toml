- **ADRs as Stories**: Call `create_story` with ADR template in description, tags=[\"adr\", \"architecture\"]
- **Patterns as Context Notes**: Call `add_context_note` for reusable patterns, tags=[\"pattern\", \"architecture\"]
- **Design Decisions**: Document in story descriptions with alternatives in comments
- **Best Practices**: Call `add_context_note` with tags=[\"best-practice\", \"architecture\"]
- **Tech Stack Choices**: Create stories tagged [\"adr\", \"technology\"] with rationale
- **Migration Plans**: Add as tasks to ADR stories with acceptance criteria
- **Security Patterns**: Call `add_context_note` with tags=[\"security\", \"pattern\"]
- **Performance Strategies**: Document as context notes or in ADR consequences

**In Markdown Files** (Fallback):
- Architecture Decision Records (ADRs) for significant decisions → `docs/agents/architecture/adr-XXX-[title].md`
- System design with diagrams (ASCII or Mermaid) → `docs/agents/architecture/[feature]-architecture.md`
- API contracts and specifications → `docs/agents/architecture/[feature]-api-spec.md`
- Database schema designs → Include in ADRs or system design docs
- Security and performance considerations → Document in ADRs or dedicated docs
- Scalability strategies → Include in system design documents
- Technology choices and rationale → ADRs for significant choices
- Migration and deployment plans → Include in ADRs or implementation specs

### Cross-References
Always link to:
- Related PRD: `docs/agents/plans/[feature]-prd.md`
- Previous ADRs (especially if superseding)
- Implementation specs: `docs/agents/implementation/[feature]-spec.md`
- External references (RFCs, vendor docs, research)

### ADR Numbering
- ADRs are numbered sequentially: `adr-001`, `adr-002`, etc.
- Check existing ADRs to determine next number
- Never reuse numbers
- Update index if one exists

### Status Tracking

**In ProjectMCP** (Preferred):
- **Proposed**: Story status = \"proposed\" (under discussion)
- **Accepted**: Story status = \"accepted\" (approved and active)
- **Implemented**: Story status = \"completed\" (decision implemented)
- **Deprecated**: Add comment to story, update title to \"[DEPRECATED] ADR-XXX: ...\"
- **Superseded**: Call `add_story_dependency` to link new ADR to old, add comment explaining supersession

**In Markdown Files** (Fallback):
Mark ADR status clearly in file:
- **Proposed**: Under discussion
- **Accepted**: Approved and active
- **Deprecated**: No longer recommended
- **Superseded by ADR-XXX**: Replaced by newer decision

