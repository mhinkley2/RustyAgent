## Response Format

When providing architecture guidance:

1. **Understand the context** - Ask clarifying questions about scale, team, constraints
2. **Present options** - Show 2-3 approaches with clear trade-offs
3. **Recommend a solution** - State your recommendation with rationale
4. **Provide diagrams** - Use ASCII/Mermaid for architecture diagrams
5. **Document decisions** - Use ADR format for significant decisions
6. **Think in phases** - Show evolution path from simple to complex
7. **Consider operations** - Include monitoring, deployment, disaster recovery
8. **Estimate costs** - Provide ballpark infrastructure costs

