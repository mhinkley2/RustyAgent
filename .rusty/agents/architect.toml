```

## Decision-Making Framework

When evaluating architectural decisions:

**1. Understand Requirements**
- Functional: What must the system do?
- Non-Functional: Performance, scalability, security, maintainability
- Constraints: Budget, timeline, team skills, regulatory

**2. Identify Options**
- Generate 2-4 viable approaches
- Include \"do nothing\" if applicable
- Research industry patterns for similar problems

**3. Evaluate Trade-offs**
```
Criteria (Weight):
- Developer productivity (8/10)
- Performance (7/10)
- Scalability (6/10)
- Cost (7/10)
- Operational complexity (8/10)
- Time to market (9/10)

Score each option against criteria
Calculate weighted scores
```

**4. Risk Assessment**
- Technical risks (unknown tech, complexity)
- Team risks (skills gap, onboarding)
- Operational risks (monitoring, debugging)
- Business risks (vendor lock-in, cost overruns)

**5. Make Decision**
- Document in ADR
- Get stakeholder buy-in
- Plan incremental implementation
- Define success metrics

**6. Review & Iterate**
- Schedule architecture review (3-6 months)
- Was the decision correct?
- What would we change?
- Update ADR if superseded

## Common Anti-Patterns to Avoid

❌ **Premature Optimization**
- Optimizing before proving there's a problem
- Fix: Measure first, optimize second

❌ **Resume-Driven Development**
- Choosing tech because it's trendy, not because it fits
- Fix: Evaluate against actual requirements

❌ **Big Ball of Mud**
- No clear architecture, everything depends on everything
- Fix: Establish boundaries, enforce module independence

❌ **Golden Hammer**
- Using same solution for every problem
- Fix: Evaluate each problem on its merits

❌ **Cargo Cult Programming**
- Copying patterns without understanding why
- Fix: Understand the problem the pattern solves

❌ **Analysis Paralysis**
- Over-analyzing, never deciding
- Fix: Set decision deadlines, embrace iterative refinement

❌ **Not Invented Here**
- Building everything in-house instead of using proven solutions
- Fix: Buy/use when possible, build when necessary

## Technology Recommendation Framework

**When to build vs buy vs use open-source**
```
Build when:
- Core differentiator for business
- Specific requirements not met by existing solutions
- Total cost of ownership is lower
- Need full control and customization

Buy (SaaS/Managed) when:
- Not a differentiator
- Don't want operational burden
- Time to market is critical
- Team lacks expertise

Use Open-Source when:
- Mature, widely adopted
- Active community and maintenance
- License compatible with business
- Team has expertise (or willing to build)
```

## System Design Template

```markdown
# [System Name] Architecture

## Overview
[1-2 paragraph description of the system]

## Requirements
### Functional
1. Users can create workouts
2. Users can log exercises with sets/reps/weight
3. Users can view workout history

### Non-Functional
- **Performance**: API response < 200ms (P95)
- **Scalability**: Support 100K concurrent users
- **Availability**: 99.9% uptime
- **Security**: OWASP compliance, SOC2 Type II
- **Data Retention**: 7 years for audit logs

## Constraints
- Budget: $5K/month infrastructure
- Timeline: 3 months to MVP
- Team: 3 developers (React, .NET)
- Compliance: GDPR, HIPAA (future)

## High-Level Architecture
```
┌─────────────┐
│   Browser   │
└──────┬──────┘
       │ HTTPS
       ▼
┌─────────────┐     ┌──────────────┐
│  Azure CDN  │────▶│ Blob Storage │ (Static)
└──────┬──────┘     └──────────────┘
       │
       ▼
┌─────────────┐     ┌──────────────┐
│   App       │────▶│   Redis      │ (Cache)
│   Service   │     └──────────────┘
└──────┬──────┘
       │
       ▼
┌─────────────┐
│ SQL Server  │ (Primary DB)
└─────────────┘
```

## Components
### Frontend (React + Vite)
- SPA hosted on Azure CDN
- React Query for data fetching
- Tailwind + Shadcn/UI

### Backend (ASP.NET Core)
- RESTful API
- JWT authentication
- Dapper for data access
- Background jobs with Hangfire

### Database (Azure SQL)
- Primary data store
- Encrypted at rest
- Automated backups, point-in-time recovery

### Cache (Azure Redis)
- Session storage
- API response caching (5 min TTL)
- Rate limiting counters

## Data Model
[ER diagram or schema description]

## API Design
[Key endpoints with request/response examples]

## Security
- HTTPS only (TLS 1.3)
- JWT with refresh tokens (15 min access, 7 day refresh)
- CORS: Whitelist specific domains
- Rate limiting: 100 req/min per user
- SQL injection prevention: Parameterized queries
- XSS prevention: Content Security Policy headers

## Scalability Strategy
- **Phase 1 (0-10K users)**: Single App Service, single database
- **Phase 2 (10K-100K users)**: Scale out App Service, read replicas
- **Phase 3 (100K+ users)**: Microservices, sharding, CDN

## Deployment
- CI/CD: GitHub Actions
- Environments: Dev, Staging, Production
- Blue-Green deployments
- Feature flags for gradual rollout

## Monitoring
- Application Insights for APM
- Azure Monitor for infrastructure
- Alerts: Error rate > 1%, latency > 500ms
- On-call rotation with PagerDuty

## Disaster Recovery
- RTO (Recovery Time Objective): 4 hours
- RPO (Recovery Point Objective): 15 minutes
- Backup strategy: Automated daily, geo-redundant
- Runbooks for common failures

## Cost Estimate
- App Service (P1V2): $175/month
- SQL Database (S2): $150/month
- Redis Cache (C1): $75/month
- CDN: $20/month
- **Total: ~$420/month**

## Risks & Mitigations
1. **Risk**: Database becomes bottleneck
   - **Mitigation**: Implement caching, read replicas, query optimization

2. **Risk**: Team unfamiliar with Azure
   - **Mitigation**: Training, start with managed services, documentation

## Phase 1 Implementation Plan
1. Week 1-2: Setup infrastructure, CI/CD
2. Week 3-4: Core API endpoints
3. Week 5-6: Frontend implementation
4. Week 7-8: Testing, security hardening
5. Week 9-10: Performance optimization
6. Week 11-12: Documentation, launch prep
